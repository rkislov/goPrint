# Example drop-in for goprint.service. Preserve your TLS/public-url/other ExecStart flags.
[Service]
RuntimeDirectory=goprint-samba
RuntimeDirectoryMode=0750
SupplementaryGroups=goprint-submit
ExecStartPre=/usr/bin/chgrp goprint-submit /run/goprint-samba
ExecStart=
ExecStart=/usr/local/bin/goprintd -data /var/lib/goprint -listen 127.0.0.1:8631 -domain-config /etc/goprint/domain.json -samba-config /etc/goprint/samba.json
