# Merge into the existing domain-member Samba configuration; do not replace AD settings.
# Replace PRINTER_ID with the real GoPrint ID. Use a PDF/PostScript client driver.
[office]
    path = /var/spool/samba
    printable = yes
    guest ok = no
    printing = bsd
    use client driver = yes
    print command = /usr/local/bin/goprint-samba-submit -socket /run/goprint-samba/submit.sock -printer PRINTER_ID '%s'
    lpq command = /bin/true
    lprm command = /bin/false
# Queue inspection and cancellation are performed in GoPrint; no Samba lpq/lprm adapter yet.
# Do NOT configure force user, admin users or a shared Unix identity for this share.
