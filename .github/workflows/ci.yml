name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: node --check internal/server/web/app.js
      - name: Install CUPS filter integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cups cups-filters ghostscript
      - run: make check
        env:
          GOPRINT_REQUIRE_CUPS_TEST: "1"
      - run: make build linux
