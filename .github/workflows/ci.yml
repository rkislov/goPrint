name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: goprint-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: node --check internal/server/web/app.js
      - name: Install CUPS filter integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cups cups-filters ghostscript cups-ipp-utils
      - run: make check
        env:
          GOPRINT_TEST_POSTGRES_DSN: "postgres://postgres:goprint-ci-only@127.0.0.1:5432/postgres?sslmode=disable"
          GOPRINT_REQUIRE_CUPS_TEST: "1"
          GOPRINT_REQUIRE_IPP_TEST: "1"
          GOPRINT_REQUIRE_DRIVERLESS_TEST: "1"
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make build linux
      - name: Smoke test Linux executable
        run: dist/linux-amd64/goprintd -version
